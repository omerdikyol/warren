# dev box tmux. A session is the unit of work: one named session per task, so a
# dropped connection or a closed laptop never stops the agent or the build.
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g status-interval 5
set -g status-left "[#S] "
set -g status-right "%H:%M %d-%b"

